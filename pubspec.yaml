name: connectme_app
description: A Flutter community app capstone with Firebase, Clean Architecture, GetIt DI, and design patterns.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_bloc: ^8.1.6
  get_it: ^8.0.2
  image_picker: ^1.1.2
  google_maps_flutter: ^2.9.0
  local_auth: ^2.3.0
  device_info_plus: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
